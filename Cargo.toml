[package]
name = "video_cut"
version = "0.1.0"
edition = "2021"
description = "A vim-like, pure keyboard-driven non-linear video editor"

[dependencies]
# GUI & Rendering
egui = "0.36"
eframe = "0.36"
egui_dock = "0.17"   # for panel layout
wgpu = "30.0"

# Media (Video & Image)
ffmpeg-next = "9.0"
fast_image_resize = "6.1"
image = "0.25"

# Audio
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
rubato = "0.15"  # Note: The research recommended 5.0.0 but rubato is at 0.15 on crates.io, using latest available.
rtrb = "0.3"

# Scripting
mlua = { version = "0.12", features = ["lua54", "vendored"] }

# Editor & Syntax
ropey = "1.6"
tree-sitter = "0.24"
tree-sitter-lua = "0.5"

# Search & Text
pinyin = "0.11"
nucleo = "0.5"

# File System & OS
notify = "8.0"
walkdir = "2.5"
dirs = "6.0"

# Serialization & Cache
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
moka = { version = "0.12", features = ["sync"] }

# Utilities & Concurrency
crossbeam-channel = "0.5"
intervaltree = "0.2"
inventory = "0.3"
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
